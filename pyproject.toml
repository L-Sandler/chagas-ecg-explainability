[project]
name = "chagas-ecg-explainability"
version = "0.1.0"
description = "Chagas disease detection from 12-lead ECG with explainability"
requires-python = ">=3.11"
dependencies = [
    # Signal processing
    "wfdb>=4.1",
    "neurokit2>=0.2",
    "scipy>=1.13",
    # Deep learning
    # Intel Mac (x86_64) is stuck at 2.2.2 (CPU; torch>=2.3 dropped that platform): smoke tests,
    # scans and analysis only. Linux pod: 2.6.0+cu124 from the pytorch-cu124 index below; reported
    # numbers come only from that environment.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.6.0; sys_platform == 'linux'",
    "pytorch-lightning>=2.3",
    # Explainability
    "captum>=0.7",
    # Experiment tracking
    "wandb>=0.17",
    # Data / evaluation
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    # Visualization
    "matplotlib>=3.9",
    "h5py>=3.16.0",
]

[tool.uv]
# Pin uv itself so the lock resolves the same way on the Mac and on the pod.
required-version = "==0.11.7"
# The lock covers only the two machines this project runs on.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
